name: Publish Cache Index
on:
  workflow_call:

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: randymarsh77/static-nix-cache
          ref: adf33d4e6ce37d8e2dac9e737a9fbaca08586b78
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Reconstruct metadata from every release shard
        run: node generate-static.js
        env:
          STORAGE_BACKEND: github-releases
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_OWNER: randymarsh77
          GITHUB_REPO: nix
          GITHUB_RELEASE_TAG: nix-cache
          LOCAL_STORAGE_PATH: ${{ runner.temp }}/cache-index
          OUTPUT_DIR: public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        id: upload
        with:
          name: github-pages-${{ github.run_attempt }}
          path: public
      - name: Wait for the uploaded artifact to be visible
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          # Upload finalization can precede visibility in the API used by deploy-pages.
          for attempt in {1..24}; do
            if artifact_ids=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
              --jq '.artifacts[].id') && grep -Fxq "$ARTIFACT_ID" <<< "$artifact_ids"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Uploaded Pages artifact $ARTIFACT_ID is not visible in the Actions API."
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
