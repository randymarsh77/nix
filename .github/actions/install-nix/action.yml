name: Install Nix with the project cache
description: Configure the signed project cache alongside cache.nixos.org
runs:
  using: composite
  steps:
    - id: key
      shell: bash
      run: echo "public-key=$(cat .github/cache/public-key)" >> "$GITHUB_OUTPUT"
    - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      with:
        extra_nix_config: |
          access-tokens = github.com=${{ github.token }}
          extra-substituters = https://randymarsh77.github.io/nix
          extra-trusted-public-keys = ${{ steps.key.outputs.public-key }}
    - name: Use modern Bash for subsequent actions
      shell: bash
      run: |
        # macOS Bash 3.2 rejects empty arrays under `set -u` in cache deploy.
        # Use Bash from the repository's locked nixpkgs on both architectures.
        bash_path=$(nix build --no-link --print-out-paths --inputs-from . 'nixpkgs#bash^out')
        echo "$bash_path/bin" >> "$GITHUB_PATH"
