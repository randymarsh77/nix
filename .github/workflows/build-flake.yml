name: Build Flake

on:
  repository_dispatch:
    types: [build-flake]

permissions:
  contents: read
concurrency:
  group: nix-cache-publisher
  cancel-in-progress: false

jobs:
  build-flake:
    name: Build Flake
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        runner: [macos-15-intel, macos-15]
        include:
          - runner: macos-15-intel
            arch: intel
          - runner: macos-15
            arch: arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-nix
      - uses: randymarsh77/static-nix-cache/setup@3caa318ea6a4b25bc92b4de0fadfb58a5fbf516d

      - name: Decode and create flake files
        env:
          FLAKE_CONTENT: ${{ github.event.client_payload.flake }}
          LOCK_CONTENT: ${{ github.event.client_payload.lock }}
        run: |
          # Decode and create flake.nix
          echo "$FLAKE_CONTENT" | base64 --decode > flake.nix
          
          # Decode and create flake.lock if provided
          if [ -n "$LOCK_CONTENT" ]; then
            echo "$LOCK_CONTENT" | base64 --decode > flake.lock
          fi
          
          # Log the created files
          echo "=== flake.nix ==="
          cat flake.nix
          echo ""
          echo "=== flake.lock ==="
          if [ -f flake.lock ]; then
            cat flake.lock
          else
            echo "(flake.lock not provided)"
          fi
          echo ""

      - name: Build flake
        run: |
          nix develop --command echo "Development shell built successfully"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require cache signing key
        env:
          SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
        run: test -n "$SIGNING_KEY"
      - name: Publish store paths
        uses: randymarsh77/static-nix-cache/deploy@3caa318ea6a4b25bc92b4de0fadfb58a5fbf516d
        with:
          github-token: ${{ github.token }}
          signing-key: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
          compression: xz
          upstream-caches: https://cache.nixos.org

  pages:
    needs: build-flake
    uses: ./.github/workflows/publish-cache.yml
    permissions:
      contents: read
      pages: write
      id-token: write
