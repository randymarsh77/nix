name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
    paths:
      - '**'
      - '!**.md'
      - '!.github/workflows/deps.yml'
      - '!.github/workflows/pr.yml'

permissions:
  contents: read

# Shared with Build Flake: releases and the metadata index have one writer.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.number) || 'nix-cache-publisher' }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/master'
    uses: ./.github/workflows/build-system.yml
    permissions:
      contents: read

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/build-system.yml
    permissions:
      contents: write
    with:
      publish: true
    secrets:
      NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}

  pages:
    needs: publish
    uses: ./.github/workflows/publish-cache.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  status:
    # Preserve the required check names configured in branch protection.
    name: CI (${{ matrix.flake }})
    if: always()
    needs: [verify, publish]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flake: [ci-intel, ci-arm]
    steps:
      - name: Require successful builds
        env:
          BUILD_SUCCEEDED: ${{ needs.verify.result == 'success' || needs.publish.result == 'success' }}
        run: test "$BUILD_SUCCEEDED" = true
